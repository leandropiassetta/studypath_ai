name: Publicar o app (GitHub Pages)

# Compila o app Flutter para a web e publica no GitHub Pages. Só a URL PÚBLICA da API entra no app,
# pela variável de repositório API_BASE_URL (Settings > Secrets and variables > Actions > Variables).
# Chaves e senhas NÃO entram aqui: ficam só no servidor da API. Veja DEPLOY.md.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar o app para a web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: A URL da API precisa estar configurada
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Defina a variável de repositório API_BASE_URL (ex.: https://studypath-api.onrender.com)." >&2
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "API_BASE_URL precisa começar com https:// (o Pages é HTTPS e o navegador bloqueia HTTP)." >&2; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compilar
        working-directory: mobile/flutter_app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          flutter pub get
          flutter build web --release --base-href "/${REPO_NAME}/" --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Nenhuma chave pode ter ido parar no pacote público
        run: |
          if grep -rEl "gsk_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY" mobile/flutter_app/build/web; then
            echo "Possível segredo no pacote do app. Abortando." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/flutter_app/build/web

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
