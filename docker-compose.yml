services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studypath
      POSTGRES_PASSWORD: studypath
      POSTGRES_DB: studypath
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studypath -d studypath']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
